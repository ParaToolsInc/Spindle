name: ci-slurm-srun-artifacts

on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Testsuite runs to attempt (stops and collects logs at first failure)'
        required: false
        default: '10'
        type: string

permissions:
  contents: read
  packages: read

jobs:
  spindle-slurm-srun-ubuntu:
    name: Testsuite (Slurm srun, Ubuntu)
    environment: Spindle CI
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: Check out Spindle
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@16feee727cbdc83b6a014e6cc26fec4a79bcf30c
        with:
          version: latest

      - name: Login to GitHub Container Registry
        if: ${{ !env.ACT }}
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate MariaDB configuration
        id: slurm-ubuntu-mariadb
        run: |
          cd containers/spindle-slurm-ubuntu/testing-srun
          ./generate_config.sh

      - name: Build spindle-slurm-ubuntu image
        id: slurm-ubuntu-build
        run: |
          cd containers/spindle-slurm-ubuntu/testing-srun
          docker compose --progress=plain build

      - name: Bring spindle-slurm-ubuntu up
        id: slurm-ubuntu-up
        run: |
          cd containers/spindle-slurm-ubuntu/testing-srun
          docker compose up -d --wait --wait-timeout 120

      - name: Verify munge works in spindle-slurm-srun-ubuntu
        id: slurm-ubuntu-munge
        run: |
          docker exec slurm-srun-head bash -c 'munge -n | unmunge'

      - name: Run spindle-slurm-srun-ubuntu testsuite until failure
        id: slurm-ubuntu-testsuite
        run: |
          set -o pipefail
          iterations='${{ inputs.iterations }}'
          iterations="${iterations:-1}"
          nodes="slurm-srun-head slurm-srun-node-1 slurm-srun-node-2 slurm-srun-node-3 slurm-srun-node-4"
          mkdir -p runlogs

          for i in $(seq 1 "$iterations"); do
            echo "=== testsuite iteration $i of $iterations ==="

            # Clear debug logs from previous iterations so a failure's logs are
            # unambiguous.
            for node in $nodes; do
              docker exec "$node" bash -c 'rm -f Spindle-build/testsuite/spindle_output.*' || true
            done

            if docker exec slurm-srun-head bash -c 'cd Spindle-build/testsuite && SPINDLE_DEBUG=3 salloc -n${workers} -N${workers} ./runTests ${workers}' 2>&1 | tee "runlogs/runTests-iter$i.log"; then
              echo "=== iteration $i passed ==="
              rm -f "runlogs/runTests-iter$i.log"
            else
              rc=$?
              echo "=== iteration $i FAILED with exit status $rc ==="
              echo "failed_iteration=$i" >> "$GITHUB_OUTPUT"
              exit "$rc"
            fi
          done
          echo "All $iterations iterations passed without reproducing the failure."

      - name: Collect Spindle and Slurm logs from containers
        if: ${{ always() && steps.slurm-ubuntu-testsuite.outcome != 'success' }}
        continue-on-error: true
        run: |
          failed=0
          mkdir -p spindle-logs
          cp -r runlogs spindle-logs/ 2>/dev/null || true

          for node in slurm-srun-head slurm-srun-node-1 slurm-srun-node-2 slurm-srun-node-3 slurm-srun-node-4; do
            echo "::group::Collecting logs from $node"

            if ! workdir=$(docker inspect -f '{{.Config.WorkingDir}}' "$node" 2>/dev/null); then
              echo "Container $node not found; skipping."
              failed=1
              echo "::endgroup::"
              continue
            fi

            if [ -z "$workdir" ]; then
              echo "WorkingDir empty for $node; cannot resolve log path."
              failed=1
              echo "::endgroup::"
              continue
            fi

            src="$workdir/Spindle-build/testsuite"
            mkdir -p "spindle-logs/$node/testsuite"

            if docker cp "$node:$src/." "spindle-logs/$node/testsuite/"; then
              find "spindle-logs/$node/testsuite" -type f ! -name 'spindle_output.*' -delete
              find "spindle-logs/$node/testsuite" -type d -empty -delete
              ls -la "spindle-logs/$node/testsuite/" || true
            else
              echo "Copy failed for $node; listing container path:"
              docker exec "$node" ls -la "$src" || docker exec "$node" ls -la "$workdir" || true
              failed=1
            fi

            # Slurm daemon logs record per-task exit codes and signals
            # (slurmd.log on compute nodes, slurmctld.log on the head node).
            mkdir -p "spindle-logs/$node/slurm"
            docker cp "$node:/var/log/slurm/." "spindle-logs/$node/slurm/" || \
              echo "No Slurm logs copied from $node."

            echo "::endgroup::"
          done

          echo "Collected tree:"
          ls -R spindle-logs/ || true
          exit "$failed"

      - name: Upload Spindle logs
        if: ${{ always() && steps.slurm-ubuntu-testsuite.outcome != 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: spindle-logs-slurm-srun
          path: spindle-logs/
          retention-days: 7
          if-no-files-found: warn

      - name: Bring spindle-slurm-ubuntu down
        id: slurm-ubuntu-down
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd containers/spindle-slurm-ubuntu/testing-srun
          docker compose down
